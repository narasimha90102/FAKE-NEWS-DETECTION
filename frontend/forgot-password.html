<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – TruthCheck</title>
  <meta name="description" content="Reset your TruthCheck account password."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<nav class="navbar">
  <a class="logo" href="index.html">
    <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2L4 7.5V16c0 6.627 5.373 12 12 12s12-5.373 12-12V7.5L16 2Z" stroke="url(#fplg1)" stroke-width="1.5" fill="rgba(99,102,241,0.08)"/>
      <path d="M11 16l3 3 7-7" stroke="url(#fplg2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="fplg1" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
        <linearGradient id="fplg2" x1="11" y1="12" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
      </defs>
    </svg>
    TruthCheck
  </a>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Home</a>
    <a href="verify.html" class="nav-link">Verify</a>
    <a href="trending.html" class="nav-link">Trending</a>
    <a href="about.html" class="nav-link">About</a>
  </div>
  <div style="display: flex; align-items: center; gap: 12px;">
    <button class="theme-btn" id="theme-toggle-btn" aria-label="Toggle Theme" style="background:transparent;border:none;color:var(--text);display:flex;align-items:center;justify-content:center;padding:8px;border-radius:50%;cursor:pointer;">
      <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg id="theme-icon-moon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <div class="nav-auth-buttons" id="nav-auth-container">
      <a href="login.html" class="nav-link-btn">Log In</a>
      <a href="register.html" class="nav-cta">Create Account</a>
    </div>
  </div>
</nav>

<main class="auth-wrapper">
  <!-- Step 1: Request Email -->
  <div id="step-request" class="auth-card">
    <div class="auth-card-header">
      <div class="auth-logo-badge">
        <svg width="14" height="14" viewBox="0 0 32 32" fill="none"><path d="M16 2L4 7.5V16c0 6.627 5.373 12 12 12s12-5.373 12-12V7.5L16 2Z" stroke="#818cf8" stroke-width="2" fill="rgba(99,102,241,0.1)"/><path d="M11 16l3 3 7-7" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Password Recovery
      </div>
      <h1 class="auth-title">Reset Your Password</h1>
      <p class="auth-subtitle">Enter your registered email address and we'll send a password reset code.</p>
    </div>

    <form class="auth-form" onsubmit="handleRequestReset(event)">
      <div class="form-group">
        <label class="form-label" for="reset-email">Email Address</label>
        <div class="form-input-wrap">
          <input type="email" id="reset-email" class="form-input" placeholder="name@domain.com" required autocomplete="email"/>
        </div>
      </div>

      <button type="submit" id="reset-submit-btn" class="btn-auth-submit">
        <span>Send Reset Link</span>
      </button>
    </form>

    <div class="auth-footer">
      Remembered your password? <a href="login.html" class="auth-link">Log In</a>
    </div>
  </div>

  <!-- Step 2: Enter Reset Token & New Password -->
  <div id="step-reset" class="auth-card" style="display:none;">
    <div class="auth-card-header">
      <div class="auth-logo-badge">
        <svg width="14" height="14" viewBox="0 0 32 32" fill="none"><path d="M16 2L4 7.5V16c0 6.627 5.373 12 12 12s12-5.373 12-12V7.5L16 2Z" stroke="#818cf8" stroke-width="2" fill="rgba(99,102,241,0.1)"/><path d="M11 16l3 3 7-7" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Set New Password
      </div>
      <h1 class="auth-title">New Password</h1>
      <p class="auth-subtitle" id="reset-sent-subtitle">Verification code sent to email.</p>
    </div>

    <form class="auth-form" onsubmit="handleConfirmReset(event)">
      <input type="hidden" id="reset-target-email"/>

      <div class="form-group">
        <label class="form-label" for="reset-token">Verification Code / Token</label>
        <div class="form-input-wrap">
          <input type="text" id="reset-token" class="form-input" placeholder="e.g. rst_9a8b7c" required/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="new-password">New Password</label>
        <div class="form-input-wrap">
          <input type="password" id="new-password" class="form-input" placeholder="••••••••" required/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm-new-password">Confirm New Password</label>
        <div class="form-input-wrap">
          <input type="password" id="confirm-new-password" class="form-input" placeholder="••••••••" required/>
        </div>
      </div>

      <button type="submit" class="btn-auth-submit">
        <span>Update Password</span>
      </button>
    </form>
  </div>
</main>

<script src="auth.js"></script>
<script>
  function handleRequestReset(e) {
    e.preventDefault();
    const email = document.getElementById('reset-email').value;

    const res = requestPasswordReset(email);
    if (!res.success) {
      showToast(res.message, 'error');
      return;
    }

    showToast(res.message, 'success');

    if (res.resetToken) {
      document.getElementById('step-request').style.display = 'none';
      document.getElementById('step-reset').style.display = 'block';
      document.getElementById('reset-target-email').value = res.email;
      document.getElementById('reset-token').value = res.resetToken;
      document.getElementById('reset-sent-subtitle').textContent = `Verification token (${res.resetToken}) sent to ${res.email}`;
    }
  }

  function handleConfirmReset(e) {
    e.preventDefault();
    const email = document.getElementById('reset-target-email').value;
    const newPwd = document.getElementById('new-password').value;
    const confPwd = document.getElementById('confirm-new-password').value;

    const res = resetPasswordWithToken(email, newPwd, confPwd);
    if (!res.success) {
      showToast(res.message, 'error');
      return;
    }

    showToast(res.message, 'success');
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  }
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof requireGuest === 'function') requireGuest();
  });
</script>
</body>
</html>
