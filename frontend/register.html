<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account – TruthCheck</title>
  <meta name="description" content="Create your TruthCheck account to start verifying news and fighting misinformation."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<nav class="navbar">
  <a class="logo" href="index.html">
    <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2L4 7.5V16c0 6.627 5.373 12 12 12s12-5.373 12-12V7.5L16 2Z" stroke="url(#rlg1)" stroke-width="1.5" fill="rgba(99,102,241,0.08)"/>
      <path d="M11 16l3 3 7-7" stroke="url(#rlg2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <defs>
        <linearGradient id="rlg1" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
        <linearGradient id="rlg2" x1="11" y1="12" x2="22" y2="22" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient>
      </defs>
    </svg>
    TruthCheck
  </a>
  <div class="nav-links" id="nav-links-container"></div>
  <div style="display: flex; align-items: center; gap: 12px;">
    <button class="theme-btn" id="theme-toggle-btn" aria-label="Toggle Theme" style="background:transparent;border:none;color:var(--text);display:flex;align-items:center;justify-content:center;padding:8px;border-radius:50%;cursor:pointer;">
      <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg id="theme-icon-moon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <div class="nav-auth-buttons" id="nav-auth-container">
      <a href="login.html" class="nav-link-btn">Log In</a>
      <a href="register.html" class="nav-cta"><span>Sign Up</span></a>
    </div>
  </div>
</nav>

<style>
  /* ── Compact register layout ── */
  body { overflow: hidden; }
  .auth-wrapper {
    min-height: calc(100vh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    padding: 28px 32px 24px;
  }
  .auth-card-header {
    margin-bottom: 20px;
  }
  .auth-title {
    font-size: 22px !important;
    margin: 6px 0 2px !important;
  }
  .auth-form {
    gap: 10px !important;
  }
  .form-group {
    margin-bottom: 0 !important;
  }
  .form-label {
    display: none !important;
  }
  .form-input {
    height: 46px !important;
    font-size: 14px !important;
    padding: 0 14px !important;
  }
  .btn-auth-submit {
    height: 46px !important;
    font-size: 15px !important;
    margin-top: 4px;
  }
  .auth-logo-badge {
    font-size: 12px !important;
  }
  .auth-footer {
    margin-top: 14px !important;
    font-size: 13px !important;
  }
  @media (max-height: 700px) {
    .auth-card { padding: 20px 28px 18px; }
    .auth-card-header { margin-bottom: 14px; }
  }
</style>

<main class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card-header">
      <div class="auth-logo-badge">
        <svg width="14" height="14" viewBox="0 0 32 32" fill="none"><path d="M16 2L4 7.5V16c0 6.627 5.373 12 12 12s12-5.373 12-12V7.5L16 2Z" stroke="#818cf8" stroke-width="2" fill="rgba(99,102,241,0.1)"/><path d="M11 16l3 3 7-7" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Join TruthCheck
      </div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle" style="color:#64748b;font-size:13px;margin:0;">Start verifying information today</p>
    </div>

    <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">

      <!-- Full Name -->
      <div class="form-group" style="position:relative;">
        <div class="form-input-wrap">
          <input type="text" id="reg-fullname" name="name" class="form-input" placeholder="Full name" required autocomplete="name"/>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <div class="form-input-wrap">
          <input type="email" id="reg-email" name="email" class="form-input" placeholder="Email address" required autocomplete="email"/>
        </div>
      </div>

      <!-- Password + Side Box -->
      <div class="form-group" style="position:static;">
        <div class="form-input-wrap">
          <input type="password" id="reg-password" name="password" class="form-input" placeholder="Password" required autocomplete="new-password"/>
          <button type="button" class="toggle-pwd-btn" onclick="togglePasswordVisibility('reg-password', this)">👁️</button>
        </div>
      </div>

      <!-- Terms Checkbox -->
      <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding-top:2px;">
        <input type="checkbox" id="reg-terms" required style="accent-color:#3b82f6;width:15px;height:15px;cursor:pointer;flex-shrink:0;">
        <label for="reg-terms" style="cursor:pointer;">I agree to the <a href="#" style="color:#3b82f6;text-decoration:none;font-weight:600;">Terms of Service</a></label>
      </div>

      <button type="submit" id="reg-submit-btn" class="btn-auth-submit" style="background:#3b82f6;color:#fff;border:none;border-radius:12px;font-weight:700;letter-spacing:0.3px;">
        <span>Sign Up</span>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html" class="auth-link" style="color:#3b82f6;">Log in</a>
    </div>
  </div>
</main>

<!-- Password Requirements Side Box (Portal — fixed position controlled by JS) -->
<div id="pwd-restrictions-box" style="display:none; position:fixed; width:248px; background:#ffffff; border-radius:16px; padding:18px 20px; box-shadow:0 12px 40px rgba(0,0,0,0.18); z-index:9999; border:1px solid rgba(0,0,0,0.06);">
  <div style="font-size:10px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:#9ca3af;margin-bottom:14px;">PASSWORD REQUIREMENTS</div>
  <div style="display:flex;flex-direction:column;gap:11px;">
    <div id="rule-len"  class="pwd-req-row"><span class="req-icon">&#8855;</span><span class="req-text">At least 8 characters</span></div>
    <div id="rule-upper" class="pwd-req-row"><span class="req-icon">&#8855;</span><span class="req-text">One uppercase letter</span></div>
    <div id="rule-lower" class="pwd-req-row"><span class="req-icon">&#8855;</span><span class="req-text">One lowercase letter</span></div>
    <div id="rule-num"  class="pwd-req-row"><span class="req-icon">&#8855;</span><span class="req-text">One number</span></div>
    <div id="rule-spec" class="pwd-req-row"><span class="req-icon">&#8855;</span><span class="req-text">One special character (@$!%*?&amp;)</span></div>
  </div>
</div>

<style>
  .pwd-req-row {
    display:flex; align-items:flex-start; gap:10px;
    font-size:13px; font-weight:600; color:#6b7280;
    transition: color 0.2s ease;
    line-height: 1.3;
  }
  .req-icon {
    font-size:15px; color:#d1d5db; flex-shrink:0;
    transition: color 0.2s ease; margin-top:1px;
  }
  .pwd-req-row.passed { color:#374151; }
  .pwd-req-row.passed .req-icon { color:#22c55e; }
</style>

<script src="auth.js"></script>
<script>
  function togglePasswordVisibility(id, btn) {
    const input = document.getElementById(id);
    if (!input) return;
    if (input.type === "password") {
      input.type = "text";
      btn.textContent = "🙈";
    } else {
      input.type = "password";
      btn.textContent = "👁️";
    }
  }

  /* Helper to update each rule in the side box */
  function updateRule(id, passed) {
    const el = document.getElementById(id);
    if (!el) return;
    if (passed) {
      el.classList.add('passed');
      const icon = el.querySelector('.req-icon');
      if (icon) icon.textContent = '\u2713';
    } else {
      el.classList.remove('passed');
      const icon = el.querySelector('.req-icon');
      if (icon) icon.innerHTML = '&#8855;';
    }
  }

  const pInput = document.getElementById('reg-password');

  // Smart-position the fixed side box next to the password input
  function positionPwdBox() {
    const pBox = document.getElementById('pwd-restrictions-box');
    const rect = pInput.getBoundingClientRect();
    const boxW = 260;
    const gap = 16;

    // Try placing to the right first
    let left = rect.right + gap;
    let top  = rect.top;

    // If it goes off the right edge of screen, place on the left
    if (left + boxW > window.innerWidth - 12) {
      left = rect.left - boxW - gap;
    }

    // Clamp top so it doesn't go below the viewport
    const boxH = pBox.offsetHeight || 200;
    if (top + boxH > window.innerHeight - 12) {
      top = window.innerHeight - boxH - 12;
    }
    if (top < 12) top = 12;

    pBox.style.left = left + 'px';
    pBox.style.top  = top  + 'px';
  }

  if (pInput) {
    const pBox = document.getElementById('pwd-restrictions-box');

    pInput.addEventListener('focus', () => {
      pBox.style.display = 'block';
      positionPwdBox();
    });
    pInput.addEventListener('blur', () => {
      setTimeout(() => { pBox.style.display = 'none'; }, 180);
    });
    window.addEventListener('resize', () => {
      if (pBox.style.display !== 'none') positionPwdBox();
    });

    pInput.addEventListener('input', () => {
      const res = validatePassword(pInput.value);
      const c = res.checks || {};

      // Map auth.js checks keys to rule IDs
      updateRule('rule-len',   c.minLen);
      updateRule('rule-upper', c.uppercase);
      updateRule('rule-lower', c.lowercase);
      updateRule('rule-num',   c.number);
      updateRule('rule-spec',  c.special);
      updateRule('rule-space', c.noSpaces);

      const msgEl = document.getElementById('pwd-val-msg');
      if (pInput.value.length === 0) { msgEl.textContent = ''; pInput.className = 'form-input'; return; }
      msgEl.textContent = res.valid ? '✓ Strong' : 'Keep going...';
      msgEl.className = res.valid ? 'val-feedback valid' : 'val-feedback invalid';
      pInput.className = res.valid ? 'form-input is-valid' : 'form-input is-invalid';
    });
  }

  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('reg-submit-btn');
    const fn = document.getElementById('reg-fullname').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pwd = document.getElementById('reg-password').value;

    if (!fn) { showToast('Please enter your full name.', 'error'); return; }
    const eRes = validateEmail(email);
    const pRes = validatePassword(pwd);

    if (!eRes.valid) { showToast(eRes.message, 'error'); return; }
    if (!pRes.valid) { showToast(pRes.message, 'error'); return; }

    btn.disabled = true;
    btn.textContent = 'Creating Account...';

    const res = await registerUser(fn, email, pwd, pwd);
    if (!res.success) {
      showToast(res.message, 'error');
      btn.disabled = false;
      btn.textContent = 'Create Account';
      return;
    }

    showToast('Account created successfully! Redirecting...', 'success');
    setTimeout(() => { window.location.href = 'login.html?registered=1'; }, 1000);
  }
</script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    if (typeof requireGuest === 'function') requireGuest();
  });
</script>
</body>
</html>
