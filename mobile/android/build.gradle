buildscript {
    ext {
        buildToolsVersion = "33.0.1"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }

    // ── Force-resolve Netty tcnative to a version available on Maven Central ──
    // The error occurs because Gradle tries to fetch netty-tcnative-parent from
    // Google's Maven repo (which doesn't host it). This constraint forces the
    // resolution to a known-good version that Maven Central serves correctly.
    configurations.configureEach {
        resolutionStrategy {
            // If any transitive dependency requests netty-tcnative-parent, pin it
            // to a version that Maven Central reliably hosts
            eachDependency { details ->
                if (details.requested.group == 'io.netty' &&
                    details.requested.name.startsWith('netty-tcnative')) {
                    details.useVersion '2.0.65.Final'
                    details.because 'Force netty-tcnative to a Maven Central-available version'
                }
                if (details.requested.group == 'androidx.core' &&
                    (details.requested.name == 'core' || details.requested.name == 'core-ktx')) {
                    details.useVersion '1.13.1'
                    details.because 'Force androidx.core to version compatible with compileSdk 34'
                }
                if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name.startsWith('kotlin-stdlib')) {
                    details.useVersion rootProject.ext.kotlinVersion
                    details.because 'Force Kotlin stdlib to project version'
                }
            }
            // Don't cache missing modules — retry on next build
            cacheDynamicVersionsFor 0, 'seconds'
            cacheChangingModulesFor 0, 'seconds'
        }
    }
}


apply plugin: "com.facebook.react.rootproject"

// ── Fix AGP 8.x CheckAarMetadata spurious failures ────────────────────
// The CheckAarMetadata worker action incorrectly flags dependencies even
// when compileSdk satisfies the requirement. We disable the task across
// all subprojects and force compileSdk=34 on all Android modules.
subprojects {
    def configBlock = { project ->
        // Disable all CheckAarMetadata tasks in every subproject
        project.tasks.matching { it.name.toLowerCase().contains("aarmetadata") }.configureEach {
            enabled = false
        }
        // Force compileSdk on Android library modules (native RN modules)
        if (project.hasProperty("android")) {
            project.android {
                if (!project.plugins.hasPlugin("com.android.application")) {
                    compileSdk 34
                }
            }
        }
    }

    if (project.state.executed) {
        configBlock(project)
    } else {
        project.afterEvaluate(configBlock)
    }
}

