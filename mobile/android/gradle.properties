# ─── Project-wide Gradle settings ────────────────────────────────

# JVM memory for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dhttps.protocols=TLSv1.2,TLSv1.3 -Dhttp.keepAlive=false

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ─── Android / React Native ─────────────────────────────────────

android.useAndroidX=true
android.enableJetifier=true

# Enable Hermes JS engine
hermesEnabled=true

# New Architecture (set to false for stability)
newArchEnabled=false
IS_NEW_ARCHITECTURE_ENABLED=false
IS_HERMES_ENABLED=true

# ─── Dependency Resolution ──────────────────────────────────────

# Disable Gradle metadata to prevent resolution of POM-only parent artifacts
# from repos that don't host them (e.g. Google Maven → netty-tcnative-parent)
org.gradle.dependency.verification=off

# ─── Signing keys ───────────────────────────────────────────────
# Override from command line or environment for release builds:
# MYAPP_RELEASE_STORE_FILE=my-release-key.keystore
# MYAPP_RELEASE_KEY_ALIAS=my-key-alias
# MYAPP_RELEASE_STORE_PASSWORD=password
# MYAPP_RELEASE_KEY_PASSWORD=password
android.builder.sdkDownload=false
