name: 🛡️ TruthGuard — Full CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── 1. BUILD APK ────────────────────────────────────────────────────────────
  build-apk:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    outputs:
      apk-artifact: TruthGuard-debug-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install mobile deps
        run: cd mobile && npm ci
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}
      - name: Generate keystore
        run: keytool -genkey -v -keystore mobile/android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug,O=Android,C=US"
      - name: Build APK
        run: cd mobile/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruthGuard-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─── 2. SELENIUM WEB TESTS ───────────────────────────────────────────────────
  selenium-web:
    name: 🌐 Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    needs: []
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:6
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'package-lock.json' }
      - uses: browser-actions/setup-chrome@v1
      - name: Install deps
        run: npm ci && cd tests/selenium && npm ci
      - name: Start backend
        run: |
          cp .env.example .env
          echo "MONGODB_URI=mongodb://localhost:27017/truthguard_test" >> .env
          echo "JWT_SECRET=test_jwt_secret_for_ci" >> .env
          echo "GROQ_API_KEY=gsk_test_placeholder" >> .env
          npm run dev:backend &
          sleep 6
      - name: Build frontend
        run: npm run build && npx --yes serve -s dist -l 5173 &
      - name: Run Selenium Tests
        working-directory: tests/selenium
        run: npm test
        env: { BASE_URL: 'http://localhost:5173', API_URL: 'http://localhost:5000', HEADLESS: 'true' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: selenium-web-report, path: tests/selenium/reports/, retention-days: 30 }

  # ─── 3. APPIUM ANDROID TESTS ─────────────────────────────────────────────────
  appium-android:
    name: 📱 Appium — Android Tests (300)
    runs-on: ubuntu-latest
    needs: [build-apk]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Download APK
        uses: actions/download-artifact@v4
        with: { name: TruthGuard-debug-apk, path: tests/appium/app/ }
        continue-on-error: true
      - name: Download or Build APK Fallback
        run: |
          mkdir -p tests/appium/app
          if [ ! -f tests/appium/app/app-debug.apk ]; then
            echo "APK not found from download, building debug APK..."
            cd mobile
            npm ci
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../tests/appium/app/app-debug.apk
          fi
      - name: Install Appium
        run: npm install -g appium@2.0.0 && appium driver install uiautomator2
      - name: Install test deps
        run: cd tests/appium && npm ci
      - name: Setup KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Create AVD
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "system-images;android-30;google_apis;x86_64"
          echo "no" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager create avd -n TruthGuard_Test -k "system-images;android-30;google_apis;x86_64" --force
      - name: Start Emulator
        run: $ANDROID_SDK_ROOT/emulator/emulator -avd TruthGuard_Test -no-window -no-audio -no-snapshot & adb wait-for-device && sleep 30
      - name: Start Appium
        run: appium --port 4723 &
      - name: Run Appium Tests
        working-directory: tests/appium
        run: npm test
        env: { APPIUM_HOST: localhost, APPIUM_PORT: 4723, APP_PATH: ./app/app-debug.apk }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: appium-android-report, path: tests/appium/reports/, retention-days: 30 }

  # ─── 4. UNIT & API TESTS ─────────────────────────────────────────────────────
  unit-tests:
    name: ✅ Unit Tests — API (300)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'package-lock.json' }
      - run: npm ci && cd tests/unit && npm ci
      - name: Run API Unit Tests
        working-directory: tests/unit
        run: npm test
        env: { MONGODB_URI: 'mongodb://localhost:27017/truthguard_test', JWT_SECRET: 'test_jwt_secret', GROQ_API_KEY: 'gsk_test' }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-test-report, path: tests/unit/reports/, retention-days: 30 }

  # ─── 5. LOAD TESTS ────────────────────────────────────────────────────────────
  load-tests:
    name: 🚀 Load Testing — Performance (300)
    runs-on: ubuntu-latest
    needs: []
    services:
      mongodb:
        image: mongo:6
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'package-lock.json' }
      - run: npm ci
      - name: Start backend
        run: |
          cp .env.example .env
          echo "MONGODB_URI=mongodb://localhost:27017/truthguard_test" >> .env
          echo "JWT_SECRET=test_jwt_secret_for_ci" >> .env
          echo "GROQ_API_KEY=gsk_test_placeholder" >> .env
          npm run dev:backend & sleep 6
      - name: Setup k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - run: cd tests/load && npm ci
      - name: Run Baseline Load Test
        working-directory: tests/load
        run: k6 run baseline.js --out json=results/baseline-raw.json
        env: { API_URL: 'http://localhost:5000' }
      - name: Run Stress Test
        working-directory: tests/load
        run: k6 run stress.js --out json=results/stress-raw.json
        env: { API_URL: 'http://localhost:5000' }
      - name: Generate Report
        working-directory: tests/load
        run: node reporter.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: load-test-report, path: tests/load/reports/, retention-days: 30 }

  # ─── 6. DEPLOYMENT STATUS ────────────────────────────────────────────────────
  deployment-status:
    name: 🚀 Deployment Status (300)
    runs-on: ubuntu-latest
    needs: [selenium-web, unit-tests, load-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'package-lock.json' }
      - run: npm ci && cd tests/validation && npm ci
      - name: Run Validation Tests
        working-directory: tests/validation
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: deployment-test-report, path: tests/validation/reports/, retention-days: 30 }

  # ─── 7. COMPILE MASTER REPORT ────────────────────────────────────────────────
  compile-report:
    name: 📊 Compile Master Report & Deploy
    runs-on: ubuntu-latest
    needs: [build-apk, selenium-web, appium-android, unit-tests, load-tests, deployment-status]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Download all reports
        uses: actions/download-artifact@v4
        with: { path: all-reports/ }
      - run: npm install exceljs
      - name: Compile full E2E report
        run: node tests/scripts/compile-report.js
      - uses: actions/upload-artifact@v4
        with: { name: full-e2e-report, path: full-e2e-report.xlsx, retention-days: 30 }
