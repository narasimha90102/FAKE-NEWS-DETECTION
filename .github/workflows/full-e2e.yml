name: 🛡️ TruthGuard — Full CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── 1. BUILD APK ────────────────────────────────────────────────────────────
  build-apk:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      apk-artifact: TruthGuard-debug-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install mobile deps
        run: cd mobile && npm ci
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}
      - name: Generate keystore
        run: |
          mkdir -p mobile/android/app
          if [ ! -f mobile/android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore mobile/android/app/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Debug,O=Android,C=US" -storetype JKS
          else
            echo "Keystore already exists, skipping generation."
          fi
      - name: Build APK
        run: cd mobile/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruthGuard-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─── 2. SELENIUM WEB TESTS ───────────────────────────────────────────────────
  selenium-web:
    name: 🌐 Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:6
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'package-lock.json' }

      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update && sudo apt-get install -y google-chrome-stable

      - name: Install root deps
        run: npm ci

      - name: Install Selenium test deps
        run: cd tests/selenium && npm ci

      - name: Start backend
        run: |
          echo "MONGODB_URI=mongodb://localhost:27017/truthguard_test" > .env
          echo "PORT=5050" >> .env
          echo "JWT_SECRET=test_jwt_secret_for_ci" >> .env
          echo "GROQ_API_KEY=gsk_test_placeholder" >> .env
          node backend/server.js &
          sleep 8
          curl -sf http://localhost:5050/api/health || (echo "Backend health check failed" && cat /tmp/server.log && exit 1)

      - name: Build & serve frontend
        run: |
          npm run build
          npx --yes serve -s dist -l 5173 &
          sleep 3

      - name: Run Selenium Tests
        working-directory: tests/selenium
        run: npm test
        env:
          BASE_URL: 'http://localhost:5173'
          API_URL: 'http://localhost:5050'
          HEADLESS: 'true'

      - name: Upload Selenium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-web-report
          path: tests/selenium/reports/
          retention-days: 30

  # ─── 3. APPIUM ANDROID TESTS ─────────────────────────────────────────────────
  appium-android:
    name: 📱 Appium — Android Tests (300)
    runs-on: ubuntu-latest
    needs: [build-apk]
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with: { name: TruthGuard-debug-apk, path: tests/appium/app/ }
        continue-on-error: true

      - name: Fallback — build APK if download failed
        run: |
          mkdir -p tests/appium/app
          if [ ! -f tests/appium/app/app-debug.apk ]; then
            echo "APK not found — building locally..."
            cd mobile && npm ci
            cd android && chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../tests/appium/app/app-debug.apk
          fi

      - name: Install Appium 2
        run: npm install -g appium@2.5.4 && appium driver install uiautomator2

      - name: Install Appium test deps
        run: cd tests/appium && npm ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Create AVD & start emulator
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "system-images;android-30;google_apis;x86_64"
          echo "no" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager create avd \
            -n TruthGuard_Test -k "system-images;android-30;google_apis;x86_64" --force
          $ANDROID_SDK_ROOT/emulator/emulator -avd TruthGuard_Test \
            -no-window -no-audio -no-snapshot -no-boot-anim &
          adb wait-for-device
          sleep 30

      - name: Start Appium server
        run: appium --port 4723 &

      - name: Run Appium Tests
        working-directory: tests/appium
        run: npm test
        env:
          APPIUM_HOST: localhost
          APPIUM_PORT: 4723
          APP_PATH: ./app/app-debug.apk

      - name: Upload Appium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-report
          path: tests/appium/reports/
          retention-days: 30

  # ─── 4. UNIT & API TESTS ─────────────────────────────────────────────────────
  unit-tests:
    name: ✅ Unit Tests — API (300)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'package-lock.json' }
      - name: Install root deps
        run: npm ci
      - name: Install unit test deps
        run: cd tests/unit && npm ci
      - name: Run Unit Tests
        working-directory: tests/unit
        run: npm test
        env:
          MONGODB_URI: 'mongodb://localhost:27017/truthguard_test'
          JWT_SECRET: 'test_jwt_secret_ci'
          GROQ_API_KEY: 'gsk_test_placeholder'
      - name: Upload Unit Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: tests/unit/reports/
          retention-days: 30

  # ─── 5. LOAD TESTS ────────────────────────────────────────────────────────────
  load-tests:
    name: 🚀 Load Testing — Performance (300)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:6
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'package-lock.json' }

      - name: Install root deps
        run: npm ci

      - name: Start backend
        run: |
          echo "MONGODB_URI=mongodb://localhost:27017/truthguard_test" > .env
          echo "PORT=5050" >> .env
          echo "JWT_SECRET=test_jwt_secret_for_ci" >> .env
          echo "GROQ_API_KEY=gsk_test_placeholder" >> .env
          node backend/server.js &
          sleep 8
          curl -sf http://localhost:5050/api/health || (echo "Backend failed to start" && exit 1)

      - name: Install k6
        run: |
          curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Create output directories
        working-directory: tests/load
        run: mkdir -p results reports artifacts

      - name: Install load test deps
        run: cd tests/load && npm ci

      - name: Run Baseline Load Test
        working-directory: tests/load
        run: |
          k6 run baseline.js \
            --out json=results/baseline-raw.json \
            --env API_URL=http://localhost:5050 \
            --env BASE_URL=http://localhost:5050
        continue-on-error: true

      - name: Run Stress Test
        working-directory: tests/load
        run: |
          k6 run stress.js \
            --out json=results/stress-raw.json \
            --env API_URL=http://localhost:5050 \
            --env BASE_URL=http://localhost:5050
        continue-on-error: true

      - name: Generate Load Test Report
        working-directory: tests/load
        run: node reporter.js

      - name: Upload Load Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: tests/load/reports/
          retention-days: 30

  # ─── 6. DEPLOYMENT STATUS ────────────────────────────────────────────────────
  deployment-status:
    name: 🚀 Deployment Status (300)
    runs-on: ubuntu-latest
    needs: [selenium-web, unit-tests, load-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'package-lock.json' }
      - name: Install root deps
        run: npm ci
      - name: Install validation deps
        run: cd tests/validation && npm ci
      - name: Run Validation Tests
        working-directory: tests/validation
        run: npm test
      - name: Upload Validation Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-test-report
          path: tests/validation/reports/
          retention-days: 30

  # ─── 7. COMPILE MASTER REPORT ────────────────────────────────────────────────
  compile-report:
    name: 📊 Compile Master Report & Deploy
    runs-on: ubuntu-latest
    needs: [build-apk, selenium-web, appium-android, unit-tests, load-tests, deployment-status]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: 'package-lock.json' }
      - name: Install root deps (includes exceljs)
        run: npm ci
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with: { path: all-reports/ }
        continue-on-error: true
      - name: Compile master Excel report
        run: node tests/scripts/compile-report.js
      - name: Upload Master Report
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: full-e2e-report.xlsx
          retention-days: 30
