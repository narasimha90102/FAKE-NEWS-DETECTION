name: 🌐 Selenium — Website Tests (300)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  selenium-web-tests:
    name: Selenium Web E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install backend dependencies
        run: npm ci

      - name: Install Selenium test dependencies
        working-directory: tests/selenium
        run: npm ci

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start backend server
        run: |
          cp .env.example .env
          echo "MONGODB_URI=mongodb://localhost:27017/truthguard_test" >> .env
          echo "JWT_SECRET=test_jwt_secret_for_ci" >> .env
          echo "GROQ_API_KEY=test_key" >> .env
          npm run dev:backend &
          sleep 5
          curl -f http://localhost:5000/api/health || exit 1

      - name: Build and serve frontend
        run: |
          npm run build
          npx --yes serve -s dist -l 5173 &
          sleep 5

      - name: Run Selenium E2E tests (300 cases)
        working-directory: tests/selenium
        run: npm test
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:5000
          HEADLESS: true

      - name: Upload Selenium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-web-report
          path: tests/selenium/reports/
          retention-days: 30
