name: 📱 Appium — Android Tests (300)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  appium-android-tests:
    name: Appium Android E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download APK artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-apk.yml
          name: TruthGuard-debug-apk
          path: tests/appium/app/
        continue-on-error: true

      - name: Install Appium
        run: |
          npm install -g appium@2.0.0
          appium driver install uiautomator2

      - name: Install Appium test dependencies
        working-directory: tests/appium
        run: npm ci

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get install -y libvirt-clients libvirt-daemon-system

      - name: Create Android Virtual Device
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "system-images;android-30;google_apis;x86_64"
          echo "no" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager create avd \
            -n TruthGuard_Test \
            -k "system-images;android-30;google_apis;x86_64" \
            --force

      - name: Start Android Emulator
        run: |
          $ANDROID_SDK_ROOT/emulator/emulator -avd TruthGuard_Test -no-window -no-audio -no-snapshot &
          adb wait-for-device
          sleep 30

      - name: Start Appium Server
        run: appium --port 4723 &

      - name: Run Appium E2E Tests (300 cases)
        working-directory: tests/appium
        run: npm test
        env:
          APPIUM_HOST: localhost
          APPIUM_PORT: 4723
          APP_PATH: ./app/app-debug.apk

      - name: Upload Appium Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-android-report
          path: tests/appium/reports/
          retention-days: 30
