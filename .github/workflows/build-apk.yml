name: 🤖 TruthGuard — Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install mobile deps
        run: cd mobile && npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('mobile/android/**/*.gradle*') }}

      - name: Generate keystore
        run: |
          mkdir -p mobile/android/app
          if [ ! -f mobile/android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore mobile/android/app/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Debug,O=Android,C=US" -storetype JKS
          else
            echo "Keystore already exists, skipping generation."
          fi

      - name: Build APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew clean assembleDebug \
            --stacktrace \
            --info \
            --warning-mode all \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruthGuard-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
