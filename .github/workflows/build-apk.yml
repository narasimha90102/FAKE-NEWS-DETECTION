name: 🤖 TruthGuard — Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install mobile deps
        run: cd mobile && npm ci

      # ── Gradle cache (wrapper + build caches) ──────────────────────
      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-wrapper-

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/configuration-cache
          key: gradle-caches-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/gradle.properties') }}
          restore-keys: |
            gradle-caches-

      # ── Generate debug keystore if needed ──────────────────────────
      - name: Generate keystore
        run: |
          mkdir -p mobile/android/app
          if [ ! -f mobile/android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore mobile/android/app/debug.keystore \
              -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Debug,O=Android,C=US" -storetype JKS
          else
            echo "Keystore already exists, skipping generation."
          fi

      # ── Clean stale Gradle state ──────────────────────────────────
      - name: Clean Gradle state
        run: |
          cd mobile/android
          chmod +x gradlew
          rm -rf .gradle/buildOutputCleanup
          ./gradlew clean --no-daemon 2>/dev/null || true

      # ── Build APK with retry logic (up to 3 attempts) ─────────────
      - name: Build APK (with retry)
        run: |
          cd mobile/android
          chmod +x gradlew

          MAX_RETRIES=3
          ATTEMPT=0
          EXIT_CODE=1

          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "━━━ Build attempt $ATTEMPT of $MAX_RETRIES ━━━"

            ./gradlew assembleDebug \
              --refresh-dependencies \
              --stacktrace \
              --info \
              --warning-mode all \
              --no-daemon \
              -Dorg.gradle.dependency.verification=off && EXIT_CODE=0 && break

            EXIT_CODE=$?
            echo "⚠️ Attempt $ATTEMPT failed with exit code $EXIT_CODE"

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              echo "🔄 Cleaning caches and retrying in 10s..."
              rm -rf ~/.gradle/caches/modules-2/files-2.1/io.netty 2>/dev/null || true
              rm -rf ~/.gradle/caches/modules-2/metadata-*/descriptors/io.netty 2>/dev/null || true
              sleep 10
            fi
          done

          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Build failed after $MAX_RETRIES attempts"
            exit $EXIT_CODE
          fi
          echo "✅ Build succeeded on attempt $ATTEMPT"

      # ── Upload artifact ────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TruthGuard-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
