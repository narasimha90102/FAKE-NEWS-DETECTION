name: ⚡ Load Testing — Performance (300)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  load-tests:
    name: Load & Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start backend server
        run: |
          cp .env.example .env
          echo "MONGODB_URI=mongodb://localhost:27017/truthguard_test" >> .env
          echo "JWT_SECRET=test_jwt_secret_for_ci" >> .env
          echo "GROQ_API_KEY=gsk_test_placeholder" >> .env
          npm run dev:backend &
          sleep 5
          curl -f http://localhost:5000/api/health

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Install load test report dependencies
        working-directory: tests/load
        run: npm ci

      - name: Run Baseline Load Test (100 users / 1 min)
        working-directory: tests/load
        run: k6 run baseline.js --out json=results/baseline-raw.json
        env:
          API_URL: http://localhost:5000

      - name: Run Stress Load Test
        working-directory: tests/load
        run: k6 run stress.js --out json=results/stress-raw.json
        env:
          API_URL: http://localhost:5000

      - name: Generate Load Test Excel Report
        working-directory: tests/load
        run: node reporter.js

      - name: Upload Load Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: tests/load/reports/
          retention-days: 30
